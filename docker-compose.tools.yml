services:
  searxng:
    image: searxng/searxng:2025.2.20-c0a21789a
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-local-searxng-secret}
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
